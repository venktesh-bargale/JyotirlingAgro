name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble storefront
        run: |
          mkdir -p _site/js/vendor
          cp index.html manifest.json robots.txt _site/
          cp -R assets css _site/
          cp js/app.js js/data.js js/i18n.js js/config.js _site/js/
          cp js/vendor/qrcode.js _site/js/vendor/
          sed -i '/^[[:space:]]*adminPassword:/d' _site/js/config.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
